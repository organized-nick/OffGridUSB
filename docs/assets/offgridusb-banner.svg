      <text x="340" y="21" fill="#f59e0b" font-family="Consolas, 'SF Mono', monospace" font-size="11" font-weight="700">2-PASS SAFETY AUDIT</text>
      <text x="340" y="38" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12">CDC • WHO • IEEE</text>
      <text x="340" y="51" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Zero-Hallucination Math</text>

      <rect x="492" y="0" width="156" height="58" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <text x="504" y="21" fill="#a78bfa" font-family="Consolas, 'SF Mono', monospace" font-size="11" font-weight="700">SELF-UPGRADING USB</text>
