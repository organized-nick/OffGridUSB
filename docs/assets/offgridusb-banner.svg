      <line x1="115" y1="20" x2="115" y2="26" />
      <line x1="128" y1="20" x2="128" y2="26" />
      <line x1="141" y1="20" x2="141" y2="26" />
      <line x1="102" y1="82" x2="102" y2="88" />
      <line x1="115" y1="82" x2="115" y2="88" />
      <line x1="128" y1="82" x2="128" y2="88" />
