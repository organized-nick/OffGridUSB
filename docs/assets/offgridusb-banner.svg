<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" role="img" aria-label="OffGridUSB — Universal Offline Knowledge, Internet-in-a-Box and Adaptive AI Harness">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="50%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#07151f" />
    </linearGradient>
    <linearGradient id="usbBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="usbMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="45%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="tacGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.55" />
    </pattern>
  </defs>

  <!-- Outer Frame & Tactical Grid -->
  <rect x="2" y="2" width="1196" height="336" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect x="2" y="2" width="1196" height="336" rx="16" fill="url(#tacGrid)" />
  <rect x="2" y="2" width="1196" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Subtle Radar / Signal Rings Behind USB -->
  <circle cx="235" cy="168" r="128" fill="none" stroke="#38bdf8" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="5 5" />
  <circle cx="235" cy="168" r="92" fill="none" stroke="#10b981" stroke-opacity="0.16" stroke-width="1" />

  <!-- Circuit Bus Traces Radiating from USB to Subsystems -->
  <g fill="none" stroke-width="2" stroke-linecap="round">
